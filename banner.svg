<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Maximiliano Rodríguez Pavez — software development</title>
  <desc id="desc">Dark banner with white typography and an angular gold A. A soft gold halo pulses and a light travels along the border. Computer Science student at PUCV, Chile.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0c121b"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#fff5d8"/>
      <stop offset=".35" stop-color="#f2cc72"/>
      <stop offset=".7" stop-color="#c39943"/>
      <stop offset="1" stop-color="#ffe1a0"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#e3b341" stop-opacity=".16"/>
      <stop offset="1" stop-color="#e3b341" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="edge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#e3c887" opacity=".16"/>
    </pattern>
    <!-- Angular A traced as a native vector from the user's reference silhouette. -->
    <path id="monogram" fill-rule="evenodd" d="M6 8 79 70 56 56Q45 49 52 65L177 296 75 209 109 229Q121 238 116 224L63 114 51 114 61 176 31 140 26 45ZM45 79 53 92 48 92Z"/>
  </defs>
  <style>
    .halo { animation: breathe 4.8s ease-in-out infinite; }
    .border-light { animation: perimeter 12s linear infinite; }
    .status-light { animation: status 4.8s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.27; } 50% { opacity:.65; } }
    @keyframes perimeter { from { stroke-dashoffset:0; } to { stroke-dashoffset:-1000; } }
    @keyframes status { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .halo,.border-light,.status-light { animation:none; }
    }
  </style>
  <rect x="3" y="3" width="1194" height="414" rx="20" fill="url(#bg)" stroke="#4a412d"/>
  <rect x="3" y="3" width="1194" height="414" rx="20" fill="none" stroke="#e9c46e" stroke-width="4" pathLength="1000" stroke-dasharray="65 935" class="border-light" filter="url(#edge-glow)" opacity=".8"/>
  <rect x="3" y="3" width="1194" height="414" rx="20" fill="none" stroke="#ffe5a5" stroke-width="1.4" pathLength="1000" stroke-dasharray="65 935" class="border-light"/>
  <rect x="798" y="25" width="365" height="365" fill="url(#dots)"/>
  <ellipse cx="985" cy="200" rx="205" ry="195" fill="url(#aura)"/>
  <path d="M39 64V39h25M1136 39h25v25M39 356v25h25M1136 381h25v-25" fill="none" stroke="#ad8a43" stroke-width="1.5"/>
  <path d="M72 83h30" stroke="#e3c077" stroke-width="2"/>
  <text x="114" y="88" fill="#e3c077" font-family="Consolas, monospace" font-size="13" letter-spacing="2.4">SOFTWARE DEVELOPMENT</text>
  <text x="72" y="166" fill="#faf7ef" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="-2">Maximiliano</text>
  <text x="72" y="224" fill="#faf7ef" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="47" letter-spacing="-1.5">Rodríguez Pavez</text>
  <text x="75" y="273" fill="#bfc3cb" font-family="Segoe UI, Arial, sans-serif" font-size="20">Curiosity into code. Ideas into working software.</text>
  <path d="M75 311h634" stroke="#35352f"/>
  <text x="75" y="346" fill="#e3c077" font-family="Consolas, monospace" font-size="13" letter-spacing="1">COMPUTER SCIENCE STUDENT</text>
  <circle cx="360" cy="341" r="2.5" fill="#ffe1a0" class="status-light"/>
  <text x="377" y="346" fill="#bfc3cb" font-family="Consolas, monospace" font-size="13" letter-spacing="1">PUCV / CHILE</text>
  <g transform="translate(895 50)">
    <use href="#monogram" fill="#efc76e" filter="url(#glow)" opacity=".45" class="halo"/>
    <use href="#monogram" fill="url(#gold)" stroke="#f1d38d" stroke-width=".35"/>
  </g>
  <text x="984" y="379" text-anchor="middle" fill="#c8aa6b" font-family="Consolas, monospace" font-size="11" letter-spacing="3">LEARNING BY BUILDING</text>
</svg>
